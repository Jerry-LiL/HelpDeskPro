services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://helpdesk:helpdesk@postgres:5432/helpdesk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 12h
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: HelpDeskPro <helpdesk@localhost>
      SLA_SCAN_INTERVAL_MS: 60000
      SYNCHRONIZE: "true"
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
